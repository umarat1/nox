# Nox 1.0.24: macOS build (Flutter UI + bundled noxd core in proxy mode). Unsigned DMG, universal.
# Output: workflow artifact "nox-macos". Nothing is published.
name: macos

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["grok/qr-amoled-qwdtt"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  SINGBOX_VERSION: "1.14.3"
  XRAY_VERSION: "26.3.27"
  NAIVE_VERSION: "v154.0.8037.49-4"

jobs:
  build:
    # macos-latest is arm64 and, on 2026-10-26, GitHub cancelled the job twice
    # before a runner was assigned. Intel still gets a machine; the bundled
    # noxd/sing-box/xray stay universal (lipo). The Flutter shell is x86_64.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          line=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml)
          echo "name=${line%%+*}" >> $GITHUB_OUTPUT
          echo "build=${line##*+}" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build noxd (universal)
        working-directory: go
        run: |
          mkdir -p ../dist/core
          GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/noxd-arm64 ./cmd/noxd
          GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/noxd-amd64 ./cmd/noxd
          lipo -create /tmp/noxd-arm64 /tmp/noxd-amd64 -output ../dist/core/noxd

      - name: Fetch cores (sing-box, Xray, NaiveProxy) for arm64 + x64
        run: |
          set -e; T=$RUNNER_TEMP; cd $T
          for a in arm64 amd64; do
            curl -fsSL -o sb-$a.tgz "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-$a.tar.gz"
            mkdir sb-$a && tar xzf sb-$a.tgz -C sb-$a --strip-components=1
          done
          lipo -create sb-arm64/sing-box sb-amd64/sing-box -output $GITHUB_WORKSPACE/dist/core/sing-box
          curl -fsSL -o x-arm.zip "https://github.com/XTLS/Xray-core/releases/download/v$XRAY_VERSION/Xray-macos-arm64-v8a.zip"
          curl -fsSL -o x-64.zip "https://github.com/XTLS/Xray-core/releases/download/v$XRAY_VERSION/Xray-macos-64.zip"
          mkdir xa x6 && unzip -q x-arm.zip -d xa && unzip -q x-64.zip -d x6
          lipo -create xa/xray x6/xray -output $GITHUB_WORKSPACE/dist/core/xray
          # klzgrad removed release assets; universal naive (arm64+x86_64) taken from Nox 1.0.20 build
          cp $GITHUB_WORKSPACE/third_party/macos/naive $GITHUB_WORKSPACE/dist/core/naive
          cp $GITHUB_WORKSPACE/third_party/windows/*.srs $GITHUB_WORKSPACE/third_party/windows/LICENSES.txt $GITHUB_WORKSPACE/dist/core/
          shasum -a 256 *.tgz *.zip
          ls -la $GITHUB_WORKSPACE/dist/core

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter build macOS
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.build }}

      - name: Bundle core + DMG (ad-hoc signed)
        run: |
          set -e
          APP=$(ls -d app/build/macos/Build/Products/Release/*.app | head -1)
          mv "$APP" /tmp/Nox.app && APP=/tmp/Nox.app
          mkdir -p $APP/Contents/Resources/core && cp dist/core/* $APP/Contents/Resources/core/
          chmod +x $APP/Contents/Resources/core/{noxd,sing-box,xray,naive}
          codesign --force --deep -s - $APP
          lipo -info $APP/Contents/MacOS/* $APP/Contents/Resources/core/noxd
          $APP/Contents/Resources/core/noxd version
          mkdir -p out/dmg && cp -R $APP out/dmg/ && ln -s /Applications out/dmg/Applications
          hdiutil create -volname "Nox ${{ steps.ver.outputs.name }}" -srcfolder out/dmg -ov -format UDZO out/Nox-${{ steps.ver.outputs.name }}-macos.dmg
          shasum -a 256 out/*.dmg

      - name: Smoke test (core starts, UI launches)
        run: |
          set -e
          /tmp/Nox.app/Contents/Resources/core/noxd run -data /tmp/noxdata & P=$!
          sleep 3; test -f /tmp/noxdata/ipc.json && echo "core ok"; kill $P || true
          (/tmp/Nox.app/Contents/MacOS/* & echo $! > /tmp/ui.pid); sleep 10
          if kill -0 $(cat /tmp/ui.pid); then echo "ui alive"; kill $(cat /tmp/ui.pid); else echo "ui exited"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nox-macos
          path: out/*.dmg
          if-no-files-found: error
          # UDZO is already compressed. Deflate on a ~160 MB DMG pinned the
          # macos-15-intel runner until it lost contact with GitHub (1.0.29).
          compression-level: 0
